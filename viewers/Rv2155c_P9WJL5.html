<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rv2155c - P9WJL5 (pim:  99.79 )</title>
  <script src="https://3Dmol.org/build/3Dmol-min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #viewer_3Dmoljs { width: 100%; height: 80%; }
  </style>
</head>
<body>

<!-- Viewer container -->
<div id="viewer_3Dmoljs"></div>
<h1>Rv2155c - P9WJL5 (pim:  99.79 )</h1>
<a href="../network_details/107CELLU_Celldivisioncluster.html">Network details</a>
<h3>Model validation</h3>
<img src="../paes/P9WJL5.png">
<table border="1">
  <tr>
    <th>PAE Mean</th>
	<th>PAE Prop<br/>Under 5</th>
	<th>PAE Max</th>
	<th>pDLLT Mean</th>
	<th>pDLLT Prop<br/>Over 90</th>
	<th>pDLLT Prop<br/>Over 70</t
  </tr>
  <tr>
	<td>6.7</td>
	<td>46.1%</td>
	<td>31</td>
	<td>91.3</td>
	<td>80%</td>
	<td>12.9%</td>
  </tr>
</table>  

<script>
  const element = document.getElementById("viewer_3Dmoljs");
  const viewer = $3Dmol.createViewer(element, { backgroundColor: "white" });

  // Download and load PDB
  const pdbUrl = "https://alphafold.ebi.ac.uk/files/AF-P9WJL5-F1-model_v4.pdb";

  fetch(pdbUrl)
    .then(response => response.text())
    .then(pdbData => {
      viewer.addModel(pdbData, "pdb");

      // Set cartoon style for the whole structure
      viewer.setStyle({}, { cartoon: { colorfunc: colorByPLDDT } });

      // Highlight residue
      viewer.setStyle(
		{ chain: 'A', resi: 257 },
        {
          stick: { colorscheme: "greenCarbon", radius: 0.25 },
          sphere: { color: "red", radius: 1.5 }
        }
      );

      // Add label to residue
      const atomres = viewer.getModel().selectedAtoms({ chain: 'A', resi: 257 })[0];
      if (atomres) {
        viewer.addLabel("A:R257G(97.37)", {
          position: { x: atomres.x, y: atomres.y, z: atomres.z },
          backgroundColor: "black",
          fontColor: "white",
          inFront: true
        });
      }

      viewer.zoomTo();
      viewer.render();
    })
    .catch(err => {
      console.error("Error loading PDB structure:", err);
    });
	
   // Function to color by pLDDT score stored in B-factor
  function colorByPLDDT(atom) {
	let score = atom.b;

	if (score > 90) return "blue";
	if (score > 70) return "cyan";
	if (score > 50) return "yellow";
	return "red";
  }
</script>

</body>
</html>
