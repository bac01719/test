<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rv1193 - O05295 (pim:  100.00 )</title>
  <script src="https://3Dmol.org/build/3Dmol-min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #viewer_3Dmoljs { width: 100%; height: 80%; }
  </style>
</head>
<body>

<!-- Viewer container -->
<div id="viewer_3Dmoljs"></div>
<h1>Rv1193 - O05295 (pim:  100.00 )</h1>
<a href="../NA">Network details</a>
<h3>Model validation</h3>
<img src="../paes/O05295.png">
<table border="1">
  <tr>
    <th>PAE Mean</th>
	<th>PAE Prop<br/>Under 5</th>
	<th>PAE Max</th>
	<th>pDLLT Mean</th>
	<th>pDLLT Prop<br/>Over 90</th>
	<th>pDLLT Prop<br/>Over 70</t
  </tr>
  <tr>
	<td>5.7</td>
	<td>55%</td>
	<td>30</td>
	<td>93.1</td>
	<td>79.7%</td>
	<td>17.1%</td>
  </tr>
</table>  

<script>
  const element = document.getElementById("viewer_3Dmoljs");
  const viewer = $3Dmol.createViewer(element, { backgroundColor: "white" });

  // Download and load PDB
  const pdbUrl = "https://alphafold.ebi.ac.uk/files/AF-O05295-F1-model_v4.pdb";

  fetch(pdbUrl)
    .then(response => response.text())
    .then(pdbData => {
      viewer.addModel(pdbData, "pdb");

      // Set cartoon style for the whole structure
      viewer.setStyle({}, { cartoon: { colorfunc: colorByPLDDT } });

      // Highlight residue
      viewer.setStyle(
		{ chain: 'A', resi: 124 },
        {
          stick: { colorscheme: "greenCarbon", radius: 0.25 },
          sphere: { color: "red", radius: 1.5 }
        }
      );

      // Add label to residue
      const atomres = viewer.getModel().selectedAtoms({ chain: 'A', resi: 124 })[0];
      if (atomres) {
        viewer.addLabel("A:P124L(89.58)", {
          position: { x: atomres.x, y: atomres.y, z: atomres.z },
          backgroundColor: "black",
          fontColor: "white",
          inFront: true
        });
      }

      viewer.zoomTo();
      viewer.render();
    })
    .catch(err => {
      console.error("Error loading PDB structure:", err);
    });
	
   // Function to color by pLDDT score stored in B-factor
  function colorByPLDDT(atom) {
	let score = atom.b;

	if (score > 90) return "blue";
	if (score > 70) return "cyan";
	if (score > 50) return "yellow";
	return "red";
  }
</script>

</body>
</html>
