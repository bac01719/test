<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rv0676c - P9WJV1 (pim:  100.00 )</title>
  <script src="https://3Dmol.org/build/3Dmol-min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #viewer_3Dmoljs { width: 100%; height: 80%; }
  </style>
</head>
<body>

<div id="viewer_3Dmoljs"></div>
<h1>Rv0676c - P9WJV1 (pim:  100.00 )</h1>
Label format: [chain]:[wildtype][pos][mutant](pLDDT,mean PAE, proportion of PAE<5)<br/><br/>
<a href="../NA">Network details</a>
<h3>Model validation</h3>
<img src="../paes/P9WJV1.png">
<table border="1">
  <tr>
    <th>PAE Mean</th>
	<th>PAE Prop<br/>Under 5</th>
	<th>PAE Max</th>
	<th>pDLLT Mean</th>
	<th>pDLLT Prop<br/>Over 90</th>
	<th>pDLLT Prop<br/>Over 70</t
  </tr>
  <tr>
	<td>14.1</td>
	<td>13.8%</td>
	<td>31</td>
	<td>83.5</td>
	<td>23.5%</td>
	<td>67%</td>
  </tr>
</table>

<script>
  const element = document.getElementById("viewer_3Dmoljs");
  const viewer = $3Dmol.createViewer(element, { backgroundColor: "white" });

  // List of mutations: { residue number, mutation label }
  const mutations = [
    { chain: 'A', resi: 948, label: "A:I948V(69.8,19.2,0.7%)", color: "red" },
    { chain: 'A', resi: 794, label: "A:T794I(80.5,11.9,16.8%)", color: "blue" },
	{ chain: 'A', resi: 767, label: "A:D767N(86.2,9.7,22.6%)", color: "yellow" }
  ];

  const pdbUrl = "https://alphafold.ebi.ac.uk/files/AF-P9WJV1-F1-model_v4.pdb";

  fetch(pdbUrl)
    .then(response => response.text())
    .then(pdbData => {
      viewer.addModel(pdbData, "pdb");

      // Show whole structure
      viewer.setStyle({}, { cartoon: { colorfunc: colorByPLDDT } });

      // Apply highlights for each mutation
      const model = viewer.getModel();
      mutations.forEach(mutation => {
        viewer.setStyle(
          { chain: mutation.chain,resi: mutation.resi },
          {
            stick: { colorscheme: "greenCarbon", radius: 0.25 },
            sphere: { color: mutation.color, radius: 1.5 }
          }
        );

        const atom = model.selectedAtoms({ chain: mutation.chain,resi: mutation.resi })[0];
        if (atom) {
          viewer.addLabel(mutation.label, {
            position: { x: atom.x, y: atom.y, z: atom.z },
            backgroundColor: "black",
            fontColor: "white",
			fontSize: 12,
            inFront: true
          });
        }
      });

      viewer.zoomTo();
      viewer.render();
    })
    .catch(err => console.error("Error loading pdb structure:", err));
	
	// Function to color by pLDDT score stored in B-factor
  function colorByPLDDT(atom) {
	let score = atom.b;

	if (score > 90) return "blue";
	if (score > 70) return "cyan";
	if (score > 50) return "yellow";
	return "red";
  }
</script>

</body>
</html>
