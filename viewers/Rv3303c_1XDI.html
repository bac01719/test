<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rv3303c - 1XDI (res:  2.81  pim:  99.78 )</title>
  <script src="https://3Dmol.org/build/3Dmol-min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #viewer_3Dmoljs { width: 100%; height: 80%; }
  </style>
</head>
<body>

<!-- Viewer container -->
<div id="viewer_3Dmoljs"></div>
<h1>Rv3303c - 1XDI (res:  2.81  pim:  99.78 )</h1>
<a href="../network_details/220STRES_Possiblestressrelatedacti.html">Network details</a>

<script>
  const element = document.getElementById("viewer_3Dmoljs");
  const viewer = $3Dmol.createViewer(element, { backgroundColor: "white" });

  // Download and load PDB
  const pdbUrl = "https://files.rcsb.org/download/1XDI.pdb";

  fetch(pdbUrl)
    .then(response => response.text())
    .then(pdbData => {
      viewer.addModel(pdbData, "pdb");

      // Set cartoon style for the whole structure
      viewer.setStyle({}, { cartoon: { color: "spectrum" } });

      // Highlight residue
      viewer.setStyle(
		{ chain: 'B', resi: 308 },
        {
          stick: { colorscheme: "greenCarbon", radius: 0.25 },
          sphere: { color: "red", radius: 1.5 }
        }
      );

      // Add label to residue
      const atomres = viewer.getModel().selectedAtoms({ chain: 'B', resi: 308 })[0];
      if (atomres) {
        viewer.addLabel("B:L308S", {
          position: { x: atomres.x, y: atomres.y, z: atomres.z },
          backgroundColor: "black",
          fontColor: "white",
		  fontSize: 12,
          inFront: true
        });
      }

      viewer.zoomTo();
      viewer.render();
    })
    .catch(err => {
      console.error("Error loading PDB structure:", err);
    });
</script>

</body>
</html>
