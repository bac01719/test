<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rv0697 - I6Y8H4 (pim:  100.00 )</title>
  <script src="https://3Dmol.org/build/3Dmol-min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #viewer_3Dmoljs { width: 100%; height: 80%; }
  </style>
</head>
<body>

<!-- Viewer container -->
<div id="viewer_3Dmoljs"></div>
<h1>Rv0697 - I6Y8H4 (pim:  100.00 )</h1>
<a href="../network_details/45METAB_Mycofactocinsystemcluster.html">Network details</a>

<script>
  const element = document.getElementById("viewer_3Dmoljs");
  const viewer = $3Dmol.createViewer(element, { backgroundColor: "white" });

  // Download and load PDB
  const pdbUrl = "https://alphafold.ebi.ac.uk/files/AF-I6Y8H4-F1-model_v4.pdb";

  fetch(pdbUrl)
    .then(response => response.text())
    .then(pdbData => {
      viewer.addModel(pdbData, "pdb");

      // Set cartoon style for the whole structure
      viewer.setStyle({}, { cartoon: { colorfunc: colorByPLDDT } });

      // Highlight residue
      viewer.setStyle(
		{ chain: 'A', resi: 475 },
        {
          stick: { colorscheme: "greenCarbon", radius: 0.25 },
          sphere: { color: "red", radius: 1.5 }
        }
      );

      // Add label to residue
      const atomres = viewer.getModel().selectedAtoms({ chain: 'A', resi: 475 })[0];
      if (atomres) {
        viewer.addLabel("A:A475P(98.32)", {
          position: { x: atomres.x, y: atomres.y, z: atomres.z },
          backgroundColor: "black",
          fontColor: "white",
          inFront: true
        });
      }

      viewer.zoomTo();
      viewer.render();
    })
    .catch(err => {
      console.error("Error loading PDB structure:", err);
    });
	
   // Function to color by pLDDT score stored in B-factor
  function colorByPLDDT(atom) {
	let score = atom.b;

	if (score > 90) return "blue";
	if (score > 70) return "cyan";
	if (score > 50) return "yellow";
	return "red";
  }
</script>

</body>
</html>
